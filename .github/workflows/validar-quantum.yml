name: Verificação temporária do catálogo
on:
  push:
    branches: [visual/central-quantum]
    paths: [.github/workflows/validar-quantum.yml]
permissions:
  contents: read
jobs:
  tkinter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Tkinter e monitor virtual
        run: |
          command -v xvfb-run || sudo apt-get install -y xvfb xauth
          /usr/bin/python3 -c "import tkinter" || sudo apt-get install -y python3-tk
      - name: Verificar tela, permissões, busca e abertura de links
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import tkinter as tk
          from unittest.mock import patch
          import central

          def filhos(pai):
              for filho in pai.winfo_children():
                  yield filho
                  yield from filhos(filho)

          def widget(tipo, texto):
              return next(w for w in filhos(central.janela)
                          if isinstance(w, tipo) and w.cget("text") == texto)

          central.janela = tk.Tk()
          central.janela.geometry("1280x800")
          central.janela.minsize(1000, 640)
          central.tela_entrada()
          central.janela.update()
          assert widget(tk.Button, "Entrar").winfo_ismapped()
          central.entrar("ana", "ana123", tk.Label(central.janela))
          central.janela.update()
          liberados = [p["nome"] for p in central.acessos.portais_do_usuario(
              central.usuario_logado, central.dados["portais"])]
          assert liberados
          restritos = [p["nome"] for p in central.dados["portais"] if p["nome"] not in liberados]
          assert restritos
          rotulos = [w.cget("text") for w in filhos(central.janela) if isinstance(w, tk.Button)]
          assert all(nome in rotulos for nome in liberados)
          assert all(nome not in rotulos for nome in restritos)
          assert "Administração" not in rotulos
          busca = next(w for w in filhos(central.janela) if isinstance(w, tk.Entry))
          busca.insert(0, "termo inexistente")
          central.janela.update()
          assert widget(tk.Label, "Nenhum portal encontrado.").winfo_ismapped()
          busca.delete(0, "end")
          central.janela.update()
          with patch("webbrowser.open") as abrir:
              widget(tk.Button, liberados[0]).invoke()
              abrir.assert_called_once()
          widget(tk.Button, "Detalhes").invoke()
          central.janela.update()
          assert widget(tk.Button, "Abrir portal").winfo_ismapped()
          widget(tk.Button, "Fechar").invoke()
          central.janela.geometry("1024x650")
          central.janela.update()
          assert widget(tk.Button, liberados[0]).winfo_ismapped()
          central.entrar("admin", "admin123", tk.Label(central.janela))
          central.janela.update()
          widget(tk.Button, "Administração").invoke()
          central.janela.update()
          assert widget(tk.Button, "Novo portal").winfo_ismapped()
          central.janela.destroy()
          print("OK: entrada, catálogo, filtro por setor, busca, detalhes, link e administração.")
          PY
